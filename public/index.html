<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171314"><meta name="description" content="Local singles club for real events and serious connections."><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>Singles Club</title></head><body>
<header><div class="wrap nav"><div class="brand"><span class="logo">S</span><span id="brand">Singles Club</span></div><div><button id="lang" class="btn ghost">EN</button><button class="btn primary" onclick="openApply()">申请加入</button></div></div></header>
<main>
<section class="wrap hero"><div><div class="eyebrow" id="eyebrow">真实活动 · 共同成长 · 认真连接</div><h1 id="headline">遇见一个<span>愿意走进未来</span>的人</h1><p id="subhead">通过真实活动和人工确认，慢慢认识一个值得认真了解的人。</p><button class="btn rose" onclick="openApply()">查看本周名额</button></div>
<div class="app"><div class="top"><b id="nearby">附近正在发生</b><span class="live"><i></i>LIVE</span></div><div class="map" id="map"><div class="mapcopy"><h3 id="maptitle">点击闪烁城市查看活动</h3><p id="mapprivacy">只显示活动区域，不显示会员实时位置。</p></div></div><div class="split"><div><h3 id="latest">最新动态</h3><div class="feed"><div id="feedTrack"></div></div></div><div><h3 id="plansTitle">会员方案</h3><div id="miniPlans"></div></div></div></div></section>
<section class="wrap block"><div class="head"><div><div class="eyebrow">EVENTS</div><h2 id="eventHeading">先一起做一件真实的小事</h2></div></div><div id="events" class="cards"></div></section>
<section class="wrap block"><div class="head"><div><div class="eyebrow">MEMBERSHIP</div><h2 id="planHeading">解锁参与，不是购买他人的隐私</h2></div></div><div id="plans" class="pricing"></div></section>
<section class="wrap block legal"><h2>清楚的规则，真实的边界</h2><p>活动由当前商家独立运营并收款。平台不保证关系结果，也不公开出售会员隐私。</p></section>
</main>
<footer><div class="wrap footer"><span id="footBrand"></span><button class="link" onclick="openStatus()">查询申请</button><a class="link" id="adminLink" href="#">商家登录</a></div></footer>

<dialog id="applyDialog"><div class="modal"><button class="close" onclick="applyDialog.close()">×</button><h2 id="applyTitle">会员申请</h2><form id="applyForm"><div class="grid2"><label>姓名或昵称<input required name="display_name"></label><label>年龄<input required type="number" min="18" name="age"></label><label>城市<input required name="city"></label><label>电话或邮箱<input required name="contact"></label></div><label>关系目标<select name="relationship_goal"><option value="serious">认真长期关系</option><option value="marriage">结婚对象</option><option value="friends">先从朋友开始</option></select></label><label>一句话介绍<textarea name="intro" required></textarea></label><label>活动或套餐<select id="offer" name="offer_key"></select></label><label>本人照片（最多3张）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="check"><input required type="checkbox">我确认已满18岁，并同意商家为审核与活动联系使用资料。</label><button class="btn primary">提交申请</button><div id="applyMsg"></div></form></div></dialog>

<dialog id="statusDialog"><div class="modal"><button class="close" onclick="statusDialog.close()">×</button><h2>查询申请状态</h2><form id="statusForm"><label>申请编号<input required name="application_code"></label><label>电话或邮箱<input required name="contact"></label><button class="btn primary">查询</button></form><div id="statusResult"></div></div></dialog>
<script src="/config.js"></script><script src="/app.js"></script><script>document.getElementById("adminLink").href=(window.APP_CONFIG?.apiBaseUrl||"")+"/admin.html";</script></body></html>
